version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: okayo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: miha barcha
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:miha%20barcha@db:5432/okayo_db

volumes:
  postgres_data:
